<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>胡俊的记账本</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(255,255,255,0.05);
      --bg-card-hover: rgba(255,255,255,0.08);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-muted: rgba(255,255,255,0.4);
      --accent-blue: #6366f1;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --accent-pink: #ec4899;
      --border-color: rgba(255,255,255,0.1);
      --shadow-glow: 0 0 20px rgba(99,102,241,0.3);
      --glass-bg: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: var(--text-primary);
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
    }

    .header {
      text-align: center;
      padding: 30px 0 20px;
      position: relative;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
    }

    .header .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .settings-btn {
      position: absolute;
      top: 30px;
      right: 0;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .settings-btn:hover {
      background: rgba(255,255,255,0.15);
      box-shadow: var(--shadow-glow);
    }

    .settings-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      display: none;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .settings-panel.show { display: block; }

    .settings-panel h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .settings-row { margin-bottom: 16px; }

    .settings-row label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .settings-row select,
    .settings-row input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
    }

    .settings-row select:focus,
    .settings-row input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .settings-row select option {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .settings-actions { display: flex; gap: 12px; margin-top: 20px; }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.5);
    }

    .btn-danger {
      background: rgba(239,68,68,0.2);
      color: var(--accent-red);
      border: 1px solid rgba(239,68,68,0.3);
    }

    .btn-danger:hover {
      background: rgba(239,68,68,0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      color: white;
      box-shadow: 0 4px 15px rgba(16,185,129,0.4);
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16,185,129,0.5);
    }

    .chat-box {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      margin-bottom: 20px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.3));
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chat-header:hover {
      background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(139,92,246,0.4));
    }

    .chat-header h3 { font-size: 15px; font-weight: 600; }

    .chat-toggle {
      font-size: 12px;
      color: var(--text-secondary);
      transition: transform 0.3s ease;
    }

    .chat-messages {
      height: 220px;
      overflow-y: auto;
      padding: 16px;
      display: none;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .chat-messages.show { display: block; }

    .chat-msg { margin-bottom: 12px; display: flex; }

    .chat-msg.user { justify-content: flex-end; }

    .chat-msg .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-msg.user .bubble {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    }

    .chat-msg.ai .bubble {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .chat-input {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border-color);
    }

    .chat-input.show { display: flex; gap: 10px; }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .chat-input input::placeholder { color: var(--text-muted); }

    .chat-input button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 18px;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(99,102,241,0.5);
    }

    .mic-btn {
      background: rgba(255,255,255,0.1);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .mic-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    .mic-btn.recording {
      background: linear-gradient(135deg, var(--accent-red), #dc2626);
      color: white;
      border-color: transparent;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 20px rgba(239,68,68,0.5);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(239,68,68,0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(239,68,68,0.7); }
    }

    .ai-section { margin-bottom: 20px; }

    .ai-btn {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .ai-btn:hover {
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.3));
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }

    .ai-result {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: none;
      animation: slideDown 0.3s ease;
    }

    .ai-result.show { display: block; }

    .ai-result .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .ai-result .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }

    .ai-result .content {
      font-size: 14px;
      line-height: 1.8;
      max-height: 350px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .ai-result .content::-webkit-scrollbar { width: 6px; }
    .ai-result .content::-webkit-scrollbar-track { background: transparent; }
    .ai-result .content::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 5px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--glass-bg);
      color: var(--text-primary);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(99,102,241,0.3);
    }

    .month-label {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .today-btn {
      background: none;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .today-btn:hover {
      background: rgba(6,182,212,0.2);
      box-shadow: 0 0 15px rgba(6,182,212,0.3);
    }

    .today-btn.active-range {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }

    /* 自定义日期区间面板 */
    .custom-range-panel {
      display: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }

    .custom-range-panel.show { display: block; }

    .custom-range-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .custom-range-group {
      flex: 1;
      min-width: 130px;
    }

    .custom-range-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .custom-range-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
      color-scheme: dark;
    }

    .custom-range-group input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .custom-range-sep {
      color: var(--text-muted);
      font-size: 16px;
      padding-bottom: 12px;
    }

    .custom-range-row .btn {
      padding: 12px 18px;
      flex-shrink: 0;
    }

    .custom-range-quick {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
    }

    .quick-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .quick-btn:hover {
      background: rgba(99,102,241,0.2);
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    .week-strip {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px 10px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .day-cell {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
      border-radius: 14px;
      position: relative;
      transition: all 0.3s ease;
    }

    .day-cell:hover {
      background: rgba(255,255,255,0.05);
    }

    .day-cell.selected {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
      transform: scale(1.05);
    }

    .day-cell .weekday {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .day-cell.selected .weekday { color: rgba(255,255,255,0.9); }

    .day-cell .date {
      font-size: 18px;
      font-weight: 700;
      margin-top: 4px;
    }

    .day-cell .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      margin: 6px auto 0;
      box-shadow: 0 0 10px rgba(16,185,129,0.5);
    }

    .day-cell.selected .dot {
      background: white;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .summary {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      flex: 1;
      padding: 20px 16px;
      border-radius: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }

    .summary-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .summary-card.income {
      background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(6,182,212,0.2));
      box-shadow: 0 8px 30px rgba(16,185,129,0.3);
    }

    .summary-card.expense {
      background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(245,158,11,0.2));
      box-shadow: 0 8px 30px rgba(239,68,68,0.3);
    }

    .summary-card.net {
      background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.2));
      box-shadow: 0 8px 30px rgba(99,102,241,0.3);
    }

    .summary-card .label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .summary-card .amount {
      font-size: 22px;
      font-weight: 700;
      margin-top: 8px;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      padding: 6px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
    }

    .filter-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      background: rgba(255,255,255,0.05);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-primary);
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 20px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 2px;
    }

    /* 图表容器 */
    .charts-section {
      margin-bottom: 24px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .chart-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .chart-card:hover {
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .chart-card.full-width {
      grid-column: 1 / -1;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-container {
      position: relative;
      height: 160px;
    }

    /* 月度报告卡片 */
    .monthly-report {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .report-title {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .report-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    .report-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-item {
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .stat-value.income { color: var(--accent-green); }
    .stat-value.expense { color: var(--accent-red); }
    .stat-value.net { color: var(--accent-blue); }
    .stat-value.avg { color: var(--accent-orange); }

    .stat-change {
      font-size: 11px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-change.up { color: var(--accent-red); }
    .stat-change.down { color: var(--accent-green); }
    .stat-change.neutral { color: var(--text-muted); }

    .top-categories {
      margin-top: 16px;
    }

    .top-cat-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .top-cat-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .top-cat-item:last-child { border-bottom: none; }

    .top-cat-rank {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .top-cat-info { flex: 1; }

    .top-cat-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .top-cat-amount {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .top-cat-percent {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-orange);
    }

    /* 预算系统 */
    .budget-section {
      margin-bottom: 24px;
    }

    .budget-card {
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.1), rgba(6,182,212,0.08));
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .budget-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .budget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .budget-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .budget-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
      border-radius: 2px;
    }

    .budget-edit-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .budget-edit-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    .budget-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .budget-spent {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary), rgba(255,255,255,0.8));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .budget-total {
      font-size: 16px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .budget-percent {
      font-size: 24px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .budget-percent.safe {
      background: rgba(16,185,129,0.2);
      color: var(--accent-green);
    }

    .budget-percent.warning {
      background: rgba(245,158,11,0.2);
      color: var(--accent-orange);
    }

    .budget-percent.danger {
      background: rgba(239,68,68,0.2);
      color: var(--accent-red);
    }

    .budget-progress {
      height: 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .budget-progress-bar {
      height: 100%;
      border-radius: 8px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
      position: relative;
    }

    .budget-progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .budget-progress-bar.safe {
      background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan));
      box-shadow: 0 0 20px rgba(16,185,129,0.4);
    }

    .budget-progress-bar.warning {
      background: linear-gradient(90deg, var(--accent-orange), #f97316);
      box-shadow: 0 0 20px rgba(245,158,11,0.4);
    }

    .budget-progress-bar.danger {
      background: linear-gradient(90deg, var(--accent-red), #dc2626);
      box-shadow: 0 0 20px rgba(239,68,68,0.4);
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 20px rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 30px rgba(239,68,68,0.6); }
    }

    .budget-status {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
    }

    .budget-status.warning { 
      color: var(--accent-orange); 
      background: rgba(245,158,11,0.1);
    }

    .budget-status.danger { 
      color: var(--accent-red); 
      background: rgba(239,68,68,0.1);
    }

    .budget-input-row {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
      z-index: 1;
    }

    .budget-input-row.show { display: flex; gap: 12px; }

    .budget-input-row input {
      flex: 1;
      padding: 14px 18px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      font-size: 15px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
    }

    .budget-input-row input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .budget-input-row input::placeholder { color: var(--text-muted); }

    .budget-input-row button {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* GitHub同步 */
    .sync-section {
      margin-bottom: 24px;
    }

    .sync-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .sync-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sync-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-status {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      color: var(--text-muted);
    }

    .sync-status.connected {
      background: rgba(16,185,129,0.2);
      color: var(--accent-green);
    }

    .sync-status.error {
      background: rgba(239,68,68,0.2);
      color: var(--accent-red);
    }

    .sync-info {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .sync-actions {
      display: flex;
      gap: 12px;
    }

    .sync-actions .btn {
      flex: 1;
    }

    .sync-token-input {
      display: none;
      margin-bottom: 16px;
    }

    .sync-token-input.show { display: block; }

    .sync-token-input input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
    }

    .sync-token-input input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }

    .sync-token-input input::placeholder { color: var(--text-muted); }

    .sync-last-sync {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: center;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .category-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .category-card:hover {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    .category-header {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .category-header:hover {
      background: rgba(255,255,255,0.03);
    }

    .category-icon {
      font-size: 28px;
      margin-right: 14px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
    }

    .category-info { flex: 1; }

    .category-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .category-count {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .category-amount {
      font-size: 18px;
      font-weight: 700;
      margin-right: 12px;
    }

    .category-amount.income { color: var(--accent-green); }
    .category-amount.expense { color: var(--accent-red); }

    .category-arrow {
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .category-header.expanded .category-arrow {
      transform: rotate(90deg);
      color: var(--accent-blue);
    }

    .category-details {
      display: none;
      border-top: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .category-details.show { display: block; }

    .detail-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }

    .detail-item:last-child { border-bottom: none; }

    .detail-item:hover {
      background: rgba(255,255,255,0.03);
    }

    .detail-time {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 12px;
      min-width: 88px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .detail-note {
      flex: 1;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .detail-note.empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .detail-amount {
      font-size: 15px;
      font-weight: 600;
      margin-left: 12px;
      font-variant-numeric: tabular-nums;
    }

    .detail-amount.income { color: var(--accent-green); }
    .detail-amount.expense { color: var(--accent-red); }

    .detail-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      margin-left: 10px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .detail-delete:hover {
      background: rgba(239,68,68,0.2);
      color: var(--accent-red);
    }

    .detail-delete:active {
      background: rgba(239,68,68,0.3);
      transform: scale(0.95);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .manual-input-section {
      margin-bottom: 24px;
    }

    .manual-input-toggle {
      width: 100%;
      padding: 14px;
      border: 1px dashed var(--glass-border);
      border-radius: 16px;
      background: var(--glass-bg);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      color: var(--text-secondary);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .manual-input-toggle:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--accent-cyan);
      color: var(--text-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .manual-input-toggle.active {
      background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(16,185,129,0.2));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .manual-form {
      display: none;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 12px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }

    .manual-form.show { display: block; }

    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6,182,212,0.2);
    }

    .form-group select option {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .form-group input::placeholder { color: var(--text-muted); }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      box-shadow: 0 4px 15px rgba(6,182,212,0.4);
    }

    .submit-btn:hover {
      box-shadow: 0 6px 20px rgba(6,182,212,0.5);
    }

    .data-tools {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tool-btn {
      flex: 1;
      padding: 14px;
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      background: var(--glass-bg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      color: var(--text-secondary);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .tool-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--accent-blue);
      color: var(--text-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .tool-btn:active {
      transform: translateY(0);
    }

    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      padding: 20px 0;
      border-top: 1px solid var(--border-color);
      margin-top: 20px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #f1f5f9;
        --bg-card: rgba(255,255,255,0.8);
        --bg-card-hover: rgba(255,255,255,0.9);
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
        --border-color: rgba(0,0,0,0.1);
        --glass-bg: rgba(255,255,255,0.7);
        --glass-border: rgba(0,0,0,0.1);
      }

      body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
      }

      .chat-msg.user .bubble {
        box-shadow: 0 4px 15px rgba(99,102,241,0.2);
      }

      .summary-card {
        border: 1px solid rgba(0,0,0,0.1);
      }

      .summary-card.income { box-shadow: 0 8px 30px rgba(16,185,129,0.15); }
      .summary-card.expense { box-shadow: 0 8px 30px rgba(239,68,68,0.15); }
      .summary-card.net { box-shadow: 0 8px 30px rgba(99,102,241,0.15); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>胡俊的记账本</h1>
    <div class="subtitle">Smart Finance Tracker</div>
  </div>
  <button class="settings-btn" id="settingsBtn">⚙️ AI 设置</button>

  <div class="settings-panel" id="settingsPanel">
    <h3>AI 设置</h3>
    <div class="settings-row">
      <label>服务商</label>
      <select id="cfgProvider">
        <option value="mimo-tp">小米 MiMo 月套餐 (Flash)</option>
        <option value="mimo-tp-pro">小米 MiMo 月套餐 (Pro)</option>
        <option value="deepseek">DeepSeek</option>
        <option value="mimo">小米 MiMo (Flash)</option>
        <option value="mimo-pro">小米 MiMo (Pro)</option>
        <option value="openai">OpenAI</option>
        <option value="tongyi">通义千问</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="moonshot">Moonshot</option>
      </select>
    </div>
    <div class="settings-row">
      <label>API Key</label>
      <input type="password" id="cfgKey" placeholder="输入你的 API Key">
    </div>
    <div class="settings-actions">
      <button class="btn btn-primary" id="saveConfig">保存设置</button>
      <button class="btn btn-danger" id="clearConfig">清除</button>
    </div>
  </div>

  <div class="chat-box">
    <div class="chat-header" id="chatHeader">
      <h3>🤖 AI 记账助手</h3>
      <span class="chat-toggle" id="chatToggle">▼</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input" id="chatInput">
      <input type="text" id="chatText" placeholder="说点什么... 如：早餐包子4.72">
      <button class="mic-btn" id="micBtn">🎤</button>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <div class="ai-section">
    <button class="ai-btn" id="aiAnalyzeBtn">✨ AI 智能分析</button>
    <div class="ai-result" id="aiResult">
      <div class="result-header">
        <div class="avatar">🤖</div>
        <span style="font-weight:600;">分析报告</span>
        <button class="btn" id="stopAiBtn" style="margin-left:auto;font-size:12px;background:rgba(239,68,68,0.2);color:var(--accent-red);border:1px solid rgba(239,68,68,0.3);">停止</button>
      </div>
      <div class="content" id="aiContent"></div>
    </div>
  </div>

  <div class="date-nav">
    <button class="nav-btn" id="prevWeek">◀</button>
    <span class="month-label" id="monthLabel"></span>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
      <button class="today-btn" id="todayBtn" data-range="day">今天</button>
      <button class="today-btn" id="weekBtn" data-range="week">本周</button>
      <button class="today-btn" id="monthBtn" data-range="month">本月</button>
      <button class="today-btn" id="customBtn" data-range="custom">自定义</button>
    </div>

    }

    function addRecord(type, record) {
      if (!record.time) record.time = formatTime(new Date());
      DATA[type].push(record);
      saveData();
      renderWeek();
      renderRecords();
      updateCharts();
      updateBudget();
      updateMonthlyReport();
    }

    function deleteRecord(type, index) {
      DATA[type].splice(index, 1);
      saveData();
      renderWeek();
      renderRecords();
      updateCharts();
      updateBudget();
      updateMonthlyReport();
    }

    // 获取当前月份的数据
    function getMonthData(year, month) {
      const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;
      return {
        income: DATA.income.filter(r => r.date.startsWith(monthStr)),
        expense: DATA.expense.filter(r => r.date.startsWith(monthStr))
      };
    }

    // 获取上个月的数据
    function getLastMonthData(year, month) {
      const lastMonth = month === 0 ? 11 : month - 1;
      const lastYear = month === 0 ? year - 1 : year;
      return getMonthData(lastYear, lastMonth);
    }

    // 更新预算显示
    function updateBudget() {
      const budget = parseInt(localStorage.getItem('account_budget') || '0');
      const d = parseDate(selectedDate);
      const monthData = getMonthData(d.getFullYear(), d.getMonth());
      const totalExpense = monthData.expense.reduce((s, r) => s + r.amount, 0);

      document.getElementById('budgetSpent').textContent = `¥${totalExpense.toFixed(2)}`;
      document.getElementById('budgetTotal').textContent = `/ ¥${budget.toFixed(2)}`;

      const progress = budget > 0 ? Math.min((totalExpense / budget) * 100, 100) : 0;
      const progressBar = document.getElementById('budgetProgress');
      const percentEl = document.getElementById('budgetPercent');
      progressBar.style.width = `${progress}%`;
      percentEl.textContent = `${progress.toFixed(1)}%`;

      // 更新状态
      const statusEl = document.getElementById('budgetStatus');
      if (budget === 0) {
        progressBar.className = 'budget-progress-bar safe';
        percentEl.className = 'budget-percent safe';
        statusEl.textContent = '未设置预算';
        statusEl.className = 'budget-status';
      } else if (progress < 70) {
        progressBar.className = 'budget-progress-bar safe';
        percentEl.className = 'budget-percent safe';
        statusEl.textContent = `还剩 ¥${(budget - totalExpense).toFixed(2)}`;
        statusEl.className = 'budget-status';
      } else if (progress < 100) {
        progressBar.className = 'budget-progress-bar warning';
        percentEl.className = 'budget-percent warning';
        statusEl.textContent = `⚠️ 已用 ${progress.toFixed(1)}%，还剩 ¥${(budget - totalExpense).toFixed(2)}`;
        statusEl.className = 'budget-status warning';
      } else {
        progressBar.className = 'budget-progress-bar danger';
        percentEl.className = 'budget-percent danger';
        statusEl.textContent = `🚨 已超支 ¥${(totalExpense - budget).toFixed(2)}`;
        statusEl.className = 'budget-status danger';
      }
    }

    // 更新报告（根据timeRange动态切换日/周/月报告）
    function updateMonthlyReport() {
      const d = parseDate(selectedDate);
      let currentData = { income: [], expense: [] };
      let compareData = { income: [], expense: [] };
      let reportTitle = '';
      let compareLabel = '';
      let dateLabel = '';

      if (timeRange === 'day') {
        // 日报告：今日 vs 昨日
        const yesterday = new Date(d);
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = formatDate(yesterday);
        
        currentData.income = DATA.income.filter(r => r.date === selectedDate);
        currentData.expense = DATA.expense.filter(r => r.date === selectedDate);
        compareData.income = DATA.income.filter(r => r.date === yesterdayStr);
        compareData.expense = DATA.expense.filter(r => r.date === yesterdayStr);
        
        reportTitle = '📊 日度报告';
        compareLabel = '较昨日';
        dateLabel = `${d.getMonth() + 1}月${d.getDate()}日`;
        
      } else if (timeRange === 'week') {
        // 周报告：本周 vs 上周
        const ws = getWeekStart(d);
        const weekEnd = addDays(ws, 6);
        const lastWeekStart = addDays(ws, -7);
        const lastWeekEnd = addDays(ws, -1);
        
        currentData.income = DATA.income.filter(r => r.date >= formatDate(ws) && r.date <= formatDate(weekEnd));
        currentData.expense = DATA.expense.filter(r => r.date >= formatDate(ws) && r.date <= formatDate(weekEnd));
        compareData.income = DATA.income.filter(r => r.date >= formatDate(lastWeekStart) && r.date <= formatDate(lastWeekEnd));
        compareData.expense = DATA.expense.filter(r => r.date >= formatDate(lastWeekStart) && r.date <= formatDate(lastWeekEnd));
        
        reportTitle = '📊 周度报告';
        compareLabel = '较上周';
        dateLabel = `${ws.getMonth() + 1}月${ws.getDate()}日 - ${weekEnd.getMonth() + 1}月${weekEnd.getDate()}日`;
        
      } else if (timeRange === 'month') {
        // 月报告：本月 vs 上月
        const currentMonth = getMonthData(d.getFullYear(), d.getMonth());
        const lastMonth = getLastMonthData(d.getFullYear(), d.getMonth());
        
        currentData = currentMonth;
        compareData = lastMonth;
        
        reportTitle = '📊 月度报告';
        compareLabel = '较上月';
        dateLabel = `${d.getFullYear()}年${d.getMonth() + 1}月`;
        
      } else {
        // 自定义区间报告
        currentData.income = DATA.income.filter(r => r.date >= customStart && r.date <= customEnd);
        currentData.expense = DATA.expense.filter(r => r.date >= customStart && r.date <= customEnd);
        // 对比区间：与自定义区间相同长度的上一段
        const startD = parseDate(customStart);
        const endD = parseDate(customEnd);
        const spanDays = Math.round((endD - startD) / 86400000) + 1;
        const prevEnd = addDays(startD, -1);
        const prevStart = addDays(prevEnd, -(spanDays - 1));
        const prevStartStr = formatDate(prevStart);
        const prevEndStr = formatDate(prevEnd);
        compareData.income = DATA.income.filter(r => r.date >= prevStartStr && r.date <= prevEndStr);
        compareData.expense = DATA.expense.filter(r => r.date >= prevStartStr && r.date <= prevEndStr);

        reportTitle = '📊 区间报告';
        compareLabel = '较上一区间';
        dateLabel = `${customStart} ~ ${customEnd}`;
      }

      const totalIncome = currentData.income.reduce((s, r) => s + r.amount, 0);
      const totalExpense = currentData.expense.reduce((s, r) => s + r.amount, 0);
      const net = totalIncome - totalExpense;

      const compareIncome = compareData.income.reduce((s, r) => s + r.amount, 0);
      const compareExpense = compareData.expense.reduce((s, r) => s + r.amount, 0);

      // 计算日均支出（仅月报告有意义）
      let avgExpense = 0;
      if (timeRange === 'month') {
        const currentDay = d.getDate();
        avgExpense = totalExpense / currentDay;
      } else if (timeRange === 'week') {
        avgExpense = totalExpense / 7;
      } else if (timeRange === 'custom') {
        const startD = parseDate(customStart);
        const endD = parseDate(customEnd);
        const spanDays = Math.max(1, Math.round((endD - startD) / 86400000) + 1);
        avgExpense = totalExpense / spanDays;
      } else {
        avgExpense = totalExpense;
      }

      // 更新标题
      document.querySelector('.report-title').textContent = reportTitle;
      document.getElementById('reportDate').textContent = dateLabel;
      document.getElementById('reportIncome').textContent = `¥${totalIncome.toFixed(2)}`;
      document.getElementById('reportExpense').textContent = `¥${totalExpense.toFixed(2)}`;
      document.getElementById('reportNet').textContent = `¥${net.toFixed(2)}`;
      document.getElementById('reportAvg').textContent = `¥${avgExpense.toFixed(2)}`;

      // 计算变化
      const incomeChange = compareIncome > 0 ? ((totalIncome - compareIncome) / compareIncome * 100) : 0;
      const expenseChange = compareExpense > 0 ? ((totalExpense - compareExpense) / compareExpense * 100) : 0;

      const incomeChangeEl = document.getElementById('reportIncomeChange');
      const expenseChangeEl = document.getElementById('reportExpenseChange');

      if (compareIncome > 0) {
        incomeChangeEl.textContent = `${compareLabel} ${incomeChange > 0 ? '+' : ''}${incomeChange.toFixed(1)}%`;
        incomeChangeEl.className = `stat-change ${incomeChange > 0 ? 'up' : incomeChange < 0 ? 'down' : 'neutral'}`;
      } else {
        incomeChangeEl.textContent = `${compareLabel}无数据`;
        incomeChangeEl.className = 'stat-change neutral';
      }

      if (compareExpense > 0) {
        expenseChangeEl.textContent = `${compareLabel} ${expenseChange > 0 ? '+' : ''}${expenseChange.toFixed(1)}%`;
        expenseChangeEl.className = `stat-change ${expenseChange > 0 ? 'up' : expenseChange < 0 ? 'down' : 'neutral'}`;
      } else {
        expenseChangeEl.textContent = `${compareLabel}无数据`;
        expenseChangeEl.className = 'stat-change neutral';
      }

      // TOP 3 支出分类
      const expenseCategoryTotals = {};
      currentData.expense.forEach(r => {
        expenseCategoryTotals[r.category] = (expenseCategoryTotals[r.category] || 0) + r.amount;
      });

      const topExpenseCategories = Object.entries(expenseCategoryTotals)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const topExpenseHtml = topExpenseCategories.map(([cat, amount], i) => {
        const percent = totalExpense > 0 ? (amount / totalExpense * 100).toFixed(1) : 0;
        const icon = ICONS.expense[cat] || ICONS.expense.default;
        return `
          <div class="top-cat-item">
            <div class="top-cat-rank">${i + 1}</div>
            <div class="top-cat-info">
              <div class="top-cat-name">${icon} ${cat}</div>
              <div class="top-cat-amount">¥${amount.toFixed(2)}</div>
            </div>
            <div class="top-cat-percent">${percent}%</div>
          </div>
        `;
      }).join('');

      document.getElementById('topExpenseCategories').innerHTML = topExpenseHtml || '<div style="color:var(--text-muted);font-size:13px;">暂无数据</div>';

      // TOP 3 收入来源
      const incomeSourceTotals = {};
      currentData.income.forEach(r => {
        incomeSourceTotals[r.source] = (incomeSourceTotals[r.source] || 0) + r.amount;
      });

      const topIncomeSources = Object.entries(incomeSourceTotals)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const topIncomeHtml = topIncomeSources.map(([source, amount], i) => {
        const percent = totalIncome > 0 ? (amount / totalIncome * 100).toFixed(1) : 0;
        const icon = ICONS.income[source] || ICONS.income.default;
        return `
          <div class="top-cat-item">
            <div class="top-cat-rank">${i + 1}</div>
            <div class="top-cat-info">
              <div class="top-cat-name">${icon} ${source}</div>
              <div class="top-cat-amount">¥${amount.toFixed(2)}</div>
            </div>
            <div class="top-cat-percent">${percent}%</div>
          </div>
        `;
      }).join('');

      document.getElementById('topIncomeCategories').innerHTML = topIncomeHtml || '<div style="color:var(--text-muted);font-size:13px;">暂无数据</div>';
    }

    // 更新图表
    function updateCharts() {
      const filtered = getFilteredRecords();
      updatePieChart(filtered);
      updateBarChart(filtered);
      
      // 日视图时隐藏每日趋势图（只有一个点没有意义）
      const lineChartCard = document.getElementById('lineChartCard');
      if (timeRange === 'day') {
        lineChartCard.style.display = 'none';
      } else {
        lineChartCard.style.display = '';
        updateLineChart(filtered);
      }
    }

    function getFilteredRecords() {
      const allRecords = [];
      DATA.income.forEach((r, i) => allRecords.push({ ...r, type: 'income', index: i }));
      DATA.expense.forEach((r, i) => allRecords.push({ ...r, type: 'expense', index: i }));

      let rangeStart = selectedDate, rangeEnd = selectedDate;
      if (timeRange === 'week') {
        const d = parseDate(selectedDate);
        const ws = getWeekStart(d);
        rangeStart = formatDate(ws);
        rangeEnd = formatDate(addDays(ws, 6));
      } else if (timeRange === 'month') {
        const d = parseDate(selectedDate);
        const y = d.getFullYear(), m = d.getMonth();
        rangeStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
        rangeEnd = `${y}-${String(m+1).padStart(2,'0')}-${new Date(y, m+1, 0).getDate()}`;
      } else if (timeRange === 'custom') {
        rangeStart = customStart;
        rangeEnd = customEnd;
      }

      return allRecords.filter(r => {
        if (timeRange === 'day') {
          return r.date === selectedDate;
        } else {
          return r.date >= rangeStart && r.date <= rangeEnd;
        }
      });
    }

    function updatePieChart(records) {
      const expenseRecords = records.filter(r => r.type === 'expense');
      const categoryTotals = {};
      expenseRecords.forEach(r => {
        categoryTotals[r.category] = (categoryTotals[r.category] || 0) + r.amount;
      });

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      if (pieChart) pieChart.destroy();

      if (labels.length === 0) {
        labels.push('暂无数据');
        data.push(1);
      }

      const ctx = document.getElementById('pieChart').getContext('2d');
      pieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: CHART_COLORS.slice(0, labels.length),
            borderColor: 'rgba(255,255,255,0.1)',
            borderWidth: 2,
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'bottom',
              labels: {
                color: 'rgba(255,255,255,0.7)',
                font: { size: 11 },
                padding: 12,
                usePointStyle: true,
                pointStyleWidth: 8
              }
            },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.8)',
              titleColor: '#fff',
              bodyColor: '#fff',
              callbacks: {
                label: function(context) {
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percentage = ((context.parsed / total) * 100).toFixed(1);
                  return `${context.label}: ¥${context.parsed.toFixed(2)} (${percentage}%)`;
                }
              }
            }
          },
          cutout: '65%'
        }
      });
    }

    function updateBarChart(records) {
      const incomeTotal = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
      const expenseTotal = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);

      if (barChart) barChart.destroy();

      const ctx = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['收入', '支出'],

    // GitHub Gist 同步功能
    // token 优先级：临时传入（验证用） > localStorage（已登录） > 空
    async function gistFetch(url, options = {}, overrideToken) {
      const token = overrideToken || localStorage.getItem(GIST_TOKEN_KEY) || '';
      const headers = {
        'Accept': 'application/vnd.github.v3+json',
        ...options.headers
      };
      if (token) {
        headers['Authorization'] = `token ${token}`;
      }
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        throw new Error(`GitHub API error: ${response.status}`);
      }
      return response.json();
    }

    async function connectGitHub() {
      const tokenInput = document.getElementById('syncTokenInput');
      const token = document.getElementById('syncToken').value.trim();

      if (!token) {
        tokenInput.classList.add('show');
        document.getElementById('syncToken').focus();
        return;
      }

      try {
        // 用用户输入的 token 验证（第三个参数临时传入，不依赖 localStorage）
        await gistFetch('https://api.github.com/user', {}, token);
        localStorage.setItem(GIST_TOKEN_KEY, token);
        tokenInput.classList.remove('show');
        
        // 检查是否已有 Gist
        let gistId = localStorage.getItem(GIST_ID_KEY);
        if (!gistId) {
          // 创建新的私密 Gist
          const gist = await gistFetch('https://api.github.com/gists', {
            method: 'POST',
            body: JSON.stringify({
              description: '胡俊记账本数据备份',
              public: false,
              files: {
                'account_data.json': {
                  content: JSON.stringify(DATA, null, 2)
                }
              }
            })
          });
          gistId = gist.id;
          localStorage.setItem(GIST_ID_KEY, gistId);
        }

        updateSyncStatus('connected');
        localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
        updateSyncUI();
      } catch (error) {
        console.error('连接失败:', error);

      }
    }

    async function callAIStream(messages, onChunk, onDone, onError) {
      const cfg = loadConfig();
      if (!cfg) { onError('请先配置 AI 设置'); return; }
      const provider = AI_PROVIDERS[cfg.provider];
      if (!provider) { onError('未知的服务商'); return; }
      abortCtrl = new AbortController();
      const timeoutId = setTimeout(() => abortCtrl.abort(), 45000);
      let gotResponse = false;
      try {
        const res = await fetch(provider.url, {
          method: 'POST',
          headers: provider.headers(cfg.key),
          body: JSON.stringify({ model: provider.model, messages, stream: true }),
          signal: abortCtrl.signal
        });
        if (!res.ok) {
          const errBody = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status}${errBody ? ': ' + errBody.slice(0, 200) : ''}`);
        }
        clearTimeout(timeoutId);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          gotResponse = true;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              const data = trimmed.slice(6);
              if (data === '[DONE]') continue;
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta;
                const content = delta?.content || json.choices?.[0]?.message?.content;
                if (content) onChunk(content);
              } catch {}
            }
          }
        }
        if (buffer.trim()) {
          const trimmed = buffer.trim();
          if (trimmed.startsWith('data: ') && trimmed.slice(6) !== '[DONE]') {
            try {
              const json = JSON.parse(trimmed.slice(6));
              const content = json.choices?.[0]?.delta?.content || json.choices?.[0]?.message?.content;
              if (content) onChunk(content);
            } catch {}
          }
        }
        onDone();
      } catch (e) {
        clearTimeout(timeoutId);
        if (e.name === 'AbortError') {
          onError(!gotResponse ? '请求超时（45秒无响应），请检查网络或 API Key' : '请求被中断');
        } else {
          onError(e.message);
        }
      }
    }

    // 本地快速解析：能识别的直接返回指令，不走AI
    function quickParse(text) {
      const t = text.replace(/\s+/g, '').toLowerCase();
      const today = todayStr;
      // 日期词
      let date = today;
      if (/昨天/.test(text)) { const d = new Date(); d.setDate(d.getDate()-1); date = formatDate(d); }
      else if (/前天/.test(text)) { const d = new Date(); d.setDate(d.getDate()-2); date = formatDate(d); }

      // 删除指令
      const delM = text.match(/删除|取消|撤回.*?(?:支出|收入)?[：:]?\s*(\S+)/);
      if (delM) return { action:'delete_record', type:'expense', date, match: delM[1] };

      // 收入识别
      const incSources = ['寄快递','抖音','快手','红包','兼职','其他收入'];
      let incSource = incSources.find(s => text.includes(s));
      // 包含"收入""赚了""赚""进账""到账"等关键词,也识别为收入
      if (!incSource && /收入|赚了|赚[了]?\d|进账|到账/.test(text)) incSource = '其他收入';
      // "寄快递" 特殊处理：避免误匹配
      if (!incSource && /快递/.test(text)) incSource = '寄快递';

      // 金额提取（支持：15 / 15.5 / 15元 / ¥15）
      const amtM = text.match(/(\d+(?:\.\d{1,2})?)\s*(?:元|块|¥)?(?=\s|$|[，。!！?？])/) ||
                   text.match(/[¥￥]\s*(\d+(?:\.\d{1,2})?)/);
      if (!amtM) return null;
      const amount = parseFloat(amtM[1]);
      if (isNaN(amount) || amount <= 0) return null;

      // 去掉金额后的文本作为备注/分类依据
      const cleanText = text.replace(amtM[0], '').replace(/[，。!！?？]/g, '').trim();

      if (incSource) {
        return { action:'add_record', type:'income', category: incSource, amount, note: cleanText.replace(incSource,'').trim() || incSource, date };
      }

      // 支出分类识别
      const catMap = {
        '早餐': ['早餐','早饭','早上吃'],
        '午餐': ['午餐','午饭','中午吃','中饭'],
        '晚餐': ['晚餐','晚饭','晚上吃'],
        '饮品': ['奶茶','咖啡','饮料','饮品','果汁','可乐','雪碧','奶','茶','汽水','矿泉水','买水','喝水'],
        '零食': ['零食','薯片','饼干','糖果','巧克力','瓜子','花生','辣条','坚果','面包','蛋糕','甜点','烧烤','炸鸡','汉堡','串','小吃'],
        '交通': ['打车','公交','地铁','出租','滴滴','高铁','火车','飞机','机票','车费','校车','骑行','共享单车','摩的','顺风车','加油','停车','过路费','高速','出租车','坐车','搭车','坐地铁','挤公交'],
        '购物': ['购物','淘宝','京东','拼多多','衣服','鞋','包','袜子','裤子','外套','日用品','纸巾','洗衣液','洗发水','牙膏','毛巾'],
        '娱乐': ['游戏','电影','KTV','唱歌','门票','网吧','网费','充值','会员','视频会员','音乐会员'],
        '学习': ['书','课程','教材','文具','打印','复印','考试','报名费','学费','资料']
      };
      let category = null; // 未匹配到支出关键词时不默认归类,交给AI判断
      for (const [cat, keywords] of Object.entries(catMap)) {
        if (keywords.some(k => text.includes(k))) { category = cat; break; }
      }
      // 备注：去掉分类关键词后的文字
      let note = cleanText;
      for (const keywords of Object.values(catMap)) {
        keywords.forEach(k => { note = note.replace(k, ''); });
      }
      note = note.trim() || category;

      if (category === null) return null; // 没有明确匹配,返回null让AI处理
      return { action:'add_record', type:'expense', category, amount, note, date };
    }

    async function sendChat() {
      const input = document.getElementById('chatText');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addChatMsg('user', text);

      // 优先本地快速解析
      const cmd = quickParse(text);
      if (cmd) {
        let resultMsg = '';
        if (cmd.action === 'add_record') {
          const record = { date: cmd.date, time: formatTime(new Date()), amount: cmd.amount, note: cmd.note || '' };
          if (cmd.type === 'income') { record.source = cmd.category; } else { record.category = cmd.category; }
          addRecord(cmd.type, record);
          resultMsg = `已记录：${cmd.type === 'income' ? '收入' : '支出'} ${cmd.category} ¥${cmd.amount}`;
        } else if (cmd.action === 'delete_record') {
          const arr = DATA[cmd.type];
          const idx = arr.findIndex(r => r.date === cmd.date && (r.source || r.category).includes(cmd.match));
          if (idx >= 0) { deleteRecord(cmd.type, idx); resultMsg = `已删除匹配"${cmd.match}"的记录`; }
          else { resultMsg = `未找到匹配"${cmd.match}"的记录`; }
        }
        if (resultMsg) {
          addChatMsg('ai', resultMsg);
          // 同步到chatHistory但不调AI
          chatHistory.push({ role: 'user', content: text });
          chatHistory.push({ role: 'assistant', content: resultMsg });
          return;
        }
      }

      // 本地无法识别，走AI
      chatHistory.push({ role: 'user', content: text });
      let aiText = '';
      addChatMsg('ai', '思考中...');
      const msgDiv = document.getElementById('chatMessages');
      const lastMsg = msgDiv.lastElementChild.querySelector('.bubble');

      await callAIStream(chatHistory, chunk => {
        aiText += chunk;
        lastMsg.textContent = aiText;
      }, () => {
        chatHistory.push({ role: 'assistant', content: aiText });
        processChat(aiText);
      }, err => {
        lastMsg.textContent = '错误：' + err;
      });
    }

    function processChat(text) {
      try {
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) return;
        const cmd = JSON.parse(jsonMatch[0]);
        if (cmd.action === 'add_record') {
          const record = {
            date: cmd.date || todayStr,
            time: formatTime(new Date()),
            amount: cmd.amount,
            note: cmd.note || ''
          };
          if (cmd.type === 'income') {
            record.source = cmd.category || '其他';
          } else {
            record.category = cmd.category || '其他';
          }
          addRecord(cmd.type, record);
          addChatMsg('ai', `已记录：${cmd.type === 'income' ? '收入' : '支出'} ${cmd.category} ¥${cmd.amount}`);
        } else if (cmd.action === 'delete_record') {
          const arr = DATA[cmd.type];
          const idx = arr.findIndex(r => r.date === cmd.date && (r.source || r.category).includes(cmd.match));
          if (idx >= 0) {
            deleteRecord(cmd.type, idx);
            addChatMsg('ai', `已删除匹配"${cmd.match}"的记录`);
          }
        }
      } catch {}
    }

    async function aiAnalyze() {
      const cfg = loadConfig();
      if (!cfg) { alert('请先配置 AI 设置'); return; }
      const resultDiv = document.getElementById('aiResult');
      const contentDiv = document.getElementById('aiContent');
      resultDiv.classList.add('show');
      contentDiv.textContent = '分析中...';

      // 根据 timeRange 决定筛选范围
      const now = new Date();
      let rangeStart, rangeEnd, rangeLabel;
      if (timeRange === 'day') {
        rangeStart = rangeEnd = selectedDate;
        rangeLabel = selectedDate;
      } else if (timeRange === 'week') {
        const d = new Date(selectedDate);
        const dow = d.getDay() || 7;
        d.setDate(d.getDate() - dow + 1);
        rangeStart = formatDate(d);
        d.setDate(d.getDate() + 6);
        rangeEnd = formatDate(d);
        rangeLabel = `${rangeStart} ~ ${rangeEnd}`;
      } else if (timeRange === 'month') {
        rangeStart = selectedDate.slice(0, 7) + '-01';
        const d = new Date(selectedDate.slice(0, 7) + '-01');
        d.setMonth(d.getMonth() + 1);
        d.setDate(0);
        rangeEnd = formatDate(d);
        rangeLabel = selectedDate.slice(0, 7).replace('-', '年') + '月';
      } else {
        // 自定义区间
        rangeStart = customStart;
        rangeEnd = customEnd;
        rangeLabel = `${customStart} ~ ${customEnd}`;
      }

      const filtered = [...DATA.income, ...DATA.expense].filter(r => r.date >= rangeStart && r.date <= rangeEnd);
      if (filtered.length === 0) { contentDiv.textContent = rangeLabel + ' 没有记录，无法分析。'; return; }

      let dataText = `时间范围：${rangeLabel}\n`;
      filtered.forEach(r => {
        const type = r.type || (r.source ? 'income' : 'expense');
        const name = r.source || r.category;
        dataText += `${r.date} ${r.time || ''} ${type === 'income' ? '收入' : '支出'}：${name} ¥${r.amount}${r.note ? '（' + r.note + '）' : ''}\n`;
      });

      const totalIncome = filtered.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
      const totalExpense = filtered.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
      dataText += `\n合计：收入 ¥${totalIncome.toFixed(2)}，支出 ¥${totalExpense.toFixed(2)}，结余 ¥${(totalIncome - totalExpense).toFixed(2)}\n`;

      const rangeDesc = timeRange === 'day' ? '当日' : timeRange === 'week' ? '本周' : timeRange === 'month' ? '本月' : '自定义区间';
      const sysP = `你是胡俊的个人财务分析助手。胡俊是一名大学生。请根据他的${rangeDesc}记账数据生成分析报告。\n\n报告包含：\n1. 收支总结（总收入、总支出、结余）\n2. 消费结构分析（各分类占比、最大支出）\n3. 消费习惯评价\n\n语气亲切自然，像朋友聊天，适当用emoji。数据引用要准确。`;
      const messages = [{ role: 'system', content: sysP }, { role: 'user', content: dataText }];

      let text = '';
      abortCtrl = null;
      await callAIStream(messages, chunk => {
        text += chunk;
        contentDiv.innerHTML = renderMd(text);
      }, () => {
        // AI分析完成后添加分享按钮
        const shareBtn = document.createElement('button');
        shareBtn.className = 'btn btn-primary';
        shareBtn.textContent = '分享报告';
        shareBtn.style.marginTop = '16px';
        shareBtn.style.width = '100%';
        shareBtn.onclick = async () => {
          const reportText = contentDiv.textContent;
          if (navigator.share) {
            try {
              await navigator.share({
                title: '胡俊的记账本 - 财务分析报告',
                text: reportText,
              });
            } catch (err) {
              console.log('分享取消或失败:', err);
            }
          } else {
            // 降级方案：复制到剪贴板
            try {
              await navigator.clipboard.writeText(reportText);
              shareBtn.textContent = '已复制到剪贴板';
              setTimeout(() => { shareBtn.textContent = '分享报告'; }, 2000);
            } catch (err) {
              // 最终降级方案：使用传统方法
              const textArea = document.createElement('textarea');
              textArea.value = reportText;
              document.body.appendChild(textArea);
              textArea.select();
              document.execCommand('copy');
              document.body.removeChild(textArea);
              shareBtn.textContent = '已复制到剪贴板';
              setTimeout(() => { shareBtn.textContent = '分享报告'; }, 2000);
            }
          }
        };
        contentDiv.appendChild(shareBtn);
      }, err => {
        contentDiv.textContent = '分析失败：' + err;
      });
    }

    function renderMd(md) {
      return md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/^- (.*)/gm, '<li>$1</li>')
        .replace(/\n/g, '<br>');
    }

    document.getElementById('settingsBtn').addEventListener('click', () => {
      document.getElementById('settingsPanel').classList.toggle('show');
    });

    document.getElementById('saveConfig').addEventListener('click', () => {
      const cfg = {
        provider: document.getElementById('cfgProvider').value,
        key: document.getElementById('cfgKey').value
      };
      saveConfig(cfg);
      updateKeyStatus();
      alert('配置已保存');
    });

    document.getElementById('clearConfig').addEventListener('click', () => {
      localStorage.removeItem('account_ai_config');
      document.getElementById('cfgKey').value = '';
      updateKeyStatus();
    });

    document.getElementById('chatHeader').addEventListener('click', () => {
      const msgs = document.getElementById('chatMessages');
      const input = document.getElementById('chatInput');
      const toggle = document.getElementById('chatToggle');
      msgs.classList.toggle('show');
      input.classList.toggle('show');
      toggle.textContent = msgs.classList.contains('show') ? '▲' : '▼';
    });

    document.getElementById('sendBtn').addEventListener('click', sendChat);
    document.getElementById('chatText').addEventListener('keypress', e => { if (e.key === 'Enter') sendChat(); });

    let recognition = null;
    document.getElementById('micBtn').addEventListener('click', () => {
      const btn = document.getElementById('micBtn');
      if (btn.classList.contains('recording')) {
        recognition?.stop();
        btn.classList.remove('recording');
        return;
      }
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        alert('浏览器不支持语音识别');
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = (e) => {
        document.getElementById('chatText').value = e.results[0][0].transcript;
        sendChat();
      };
      recognition.onend = () => btn.classList.remove('recording');
      recognition.onerror = () => btn.classList.remove('recording');
      recognition.start();
      btn.classList.add('recording');
    });

    // 今天/本周/本月 切换
    function updateRangeButtons() {
      document.querySelectorAll('[data-range]').forEach(btn => {
        btn.style.background = btn.dataset.range === timeRange ? 'linear-gradient(135deg, var(--accent-blue), var(--accent-purple))' : '';
        btn.style.color = btn.dataset.range === timeRange ? '#fff' : '';
      });
    }

    // 应用自定义日期区间
    function applyCustomRange() {
      const startInput = document.getElementById('customStart').value;
      const endInput = document.getElementById('customEnd').value;
      if (!startInput || !endInput) {
        alert('请选择起始和结束日期');
        return;
      }
      if (startInput > endInput) {
        alert('起始日期不能晚于结束日期');
        return;
      }
      customStart = startInput;
      customEnd = endInput;
      timeRange = 'custom';
      updateRangeButtons();
      renderRecords();
      updateCharts();
      updateMonthlyReport();
    }

    // 快捷区间选择
    function setQuickRange(type) {
      const today = new Date();
      let start, end;
      if (type === '7') { start = addDays(today, -6); end = today; }
      else if (type === '30') { start = addDays(today, -29); end = today; }
      else if (type === '90') { start = addDays(today, -89); end = today; }
      else if (type === 'thisMonth') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = today;
      } else if (type === 'lastMonth') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
      }
      customStart = formatDate(start);
      customEnd = formatDate(end);
      document.getElementById('customStart').value = customStart;
      document.getElementById('customEnd').value = customEnd;
      timeRange = 'custom';
      updateRangeButtons();
      renderRecords();
      updateCharts();
      updateMonthlyReport();
    }

    document.querySelectorAll('[data-range]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.range === 'custom') {
          // 自定义按钮：展开/收起面板，并切换到 custom 模式
          const panel = document.getElementById('customRangePanel');
          const willShow = !panel.classList.contains('show');
          panel.classList.toggle('show');
          if (willShow) {
            document.getElementById('customStart').value = customStart;
            document.getElementById('customEnd').value = customEnd;
            timeRange = 'custom';
            updateRangeButtons();
            renderRecords();
            updateCharts();
            updateMonthlyReport();
          }
        } else {
          // 其他按钮：收起自定义面板
          document.getElementById('customRangePanel').classList.remove('show');
          timeRange = btn.dataset.range;
          updateRangeButtons();
          renderRecords();
          updateCharts();
          updateMonthlyReport();
        }
      });
    });

    document.getElementById('customApply').addEventListener('click', applyCustomRange);
    document.getElementById('customReset').addEventListener('click', () => {
      const today = new Date();
      customStart = formatDate(addDays(today, -29));
      customEnd = formatDate(today);
      document.getElementById('customStart').value = customStart;
      document.getElementById('customEnd').value = customEnd;
      if (timeRange === 'custom') {
        renderRecords();
        updateCharts();
        updateMonthlyReport();
      }
    });
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => setQuickRange(btn.dataset.quick));
    });

    updateRangeButtons();

    document.getElementById('aiAnalyzeBtn').addEventListener('click', aiAnalyze);
    document.getElementById('stopAiBtn').addEventListener('click', () => { abortCtrl?.abort(); });

    document.getElementById('prevWeek').addEventListener('click', () => {
      // custom 模式下点翻页按钮，自动切回 week 模式
      if (timeRange === 'custom' || timeRange === 'day' || timeRange === 'month') {
        timeRange = 'week';

      selectedDate = formatDate(weekStart);
      updateRangeButtons();
      renderWeek();
      renderRecords();
      updateCharts();
      updateBudget();
      updateMonthlyReport();

    document.getElementById('nextWeek').addEventListener('click', () => {
      if (timeRange === 'custom' || timeRange === 'day' || timeRange === 'month') {
        timeRange = 'week';
        document.getElementById('customRangePanel').classList.remove('show');
      }
      weekStart = addDays(weekStart, 7);
      selectedDate = formatDate(weekStart);
      updateRangeButtons();
      renderWeek();

      updateCharts();
      updateBudget();
      updateMonthlyReport();

    document.getElementById('todayBtn').addEventListener('click', () => {
      weekStart = getWeekStart(TODAY);
      selectedDate = todayStr;
      renderWeek();
      renderRecords();
      updateCharts();
      updateBudget();
      updateMonthlyReport();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));

      });

    // Manual input form logic
    const EXPENSE_CATEGORIES = ['早餐', '午餐', '晚餐', '饮品', '零食', '交通', '购物', '娱乐', '学习', '其他'];
    const INCOME_CATEGORIES = ['寄快递', '抖音', '快手', '红包', '兼职', '其他'];

    function updateCategoryOptions() {
      const type = document.getElementById('manualType').value;
      const categorySelect = document.getElementById('manualCategory');
      const categories = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
      categorySelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    document.getElementById('manualInputBtn').addEventListener('click', () => {
      const form = document.getElementById('manualForm');
      const btn = document.getElementById('manualInputBtn');
      form.classList.toggle('show');
      btn.classList.toggle('active');
      if (form.classList.contains('show')) {
        document.getElementById('manualDate').value = selectedDate;
        document.getElementById('manualTime').value = formatTime(new Date());
        updateCategoryOptions();
      }
    });

    document.getElementById('manualType').addEventListener('change', updateCategoryOptions);

    document.getElementById('manualSubmit').addEventListener('click', () => {
      const type = document.getElementById('manualType').value;
      const category = document.getElementById('manualCategory').value;
      const amount = parseFloat(document.getElementById('manualAmount').value);
      const date = document.getElementById('manualDate').value;
      const time = document.getElementById('manualTime').value;
      const note = document.getElementById('manualNote').value.trim();

      if (!date) { alert('请选择日期'); return; }

      }

      addRecord(type, record);

      document.getElementById('manualAmount').value = '';
      document.getElementById('manualNote').value = '';

    // 预算设置
    document.getElementById('budgetEditBtn').addEventListener('click', () => {

        alert('请输入有效的预算金额');
        return;

      localStorage.setItem('account_budget', amount.toString());
      document.getElementById('budgetInputRow').classList.remove('show');
      updateBudget();

    // GitHub 同步按钮
    document.getElementById('syncUploadBtn').addEventListener('click', uploadData);
    document.getElementById('syncDownloadBtn').addEventListener('click', downloadData);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `记账本_${todayStr}.json`;
      a.click();
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (confirm('导入将覆盖现有数据，确定？')) {
          DATA = JSON.parse(reader.result);
          saveData();
          renderWeek();
          renderRecords();
          updateCharts();
          updateBudget();
          updateMonthlyReport();
        }
      };
      reader.readAsText(file);
    });

    // 初始化
    loadData();
    renderWeek();
    renderRecords();
    updateKeyStatus();
    updateSyncUI();
    
    // 延迟初始化图表，确保 Chart.js 已加载
    setTimeout(() => {
      updateCharts();
      updateBudget();
      updateMonthlyReport();
      // 显示月度报告
      document.getElementById('monthlyReport').style.display = 'block';
    }, 100);
  </script>
